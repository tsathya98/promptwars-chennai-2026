[project]
name = "backend"
version = "0.1.0"
description = "Optional Python sidecar (FastAPI + Gemini) — managed with uv, never pip"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "google-genai>=1.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
